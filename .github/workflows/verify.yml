name: verify

# Every pull request, whatever it targets: an increment that fails the chain
# should not have to wait until it is accumulated for us to know.
on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run it interrupts.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The recorded corpus is stored through Git LFS, and checkout fetches
      # pointer files unless told otherwise. A pointer is 130 bytes of text
      # where a recording is expected, so the bench would fail at the decoder
      # — a long way from the checkout that actually caused it.
      - uses: actions/checkout@v7
        with:
          lfs: true

      # Installs what mise.toml pins, the same versions a developer runs.
      - uses: jdx/mise-action@v5

      # Installs the nested packages too, through the repository's own
      # postinstall — the CI sets nothing up that a developer does not.
      - run: bun install --frozen-lockfile

      # The same chain the pre-commit hook runs, over the whole repository.
      - run: tools/verify
