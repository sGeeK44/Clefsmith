name: e2e

# The suite runs on the release pull request, and nowhere else: forty-five
# minutes is not something an ordinary change waits for. What ships is still
# what was exercised — the release pull request is the last gate before the
# tag.
#
# The workflow is still triggered by every pull request that targets the
# default branch; it is the jobs that stand down. A workflow that did not
# trigger at all would leave its checks pending forever on a branch that
# requires them, whereas a job skipped by a condition reports success — which
# is what lets the same two checks stay required and still mean something on
# the release pull request.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # The release pull request, or a run asked for by hand. Repeated on the
    # iOS job below: a job-level condition cannot read a shared value.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    # Roughly twice what the job takes. Without a limit GitHub's own default
    # applies, and a suite that hangs holds a runner for six hours before
    # anyone is told. The iOS job below is given more: it builds WebDriverAgent
    # on top of the app.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The app build embeds the recorded corpus; see verify.yml.
          lfs: true

      # Installs what mise.toml pins, the same versions a developer runs.
      - uses: jdx/mise-action@v5

      - run: bun install --frozen-lockfile

      # The native folders are not in the repository: the job generates them,
      # which is what lets the build run without an Expo account.
      - run: bunx expo prebuild --platform android --no-install

      # Gradle reads JAVA_HOME, and the runner ships one of its own: without
      # this it would silently build on a JDK nobody declared.
      - run: echo "JAVA_HOME=$(mise where java)" >> "$GITHUB_ENV"

      # After the prebuild: the Gradle files the key is computed from do not
      # exist until the native folder is generated.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Configuring the project downloads the NDK, and that download fails on a
      # hosted runner often enough to have broken a run already. A real build
      # error fails the second attempt too.
      - run: ./gradlew assembleRelease || ./gradlew assembleRelease
        working-directory: android

      # ubuntu-latest ships /dev/kvm but not the permissions to use it. Without
      # this the emulator falls back to software rendering and boots in minutes
      # instead of seconds.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          avd-name: clefsmith
          script: bun run e2e
        env:
          E2E_PLATFORM: android
          E2E_ANDROID_APP: ${{ github.workspace }}/android/app/build/outputs/apk/release/app-release.apk
          E2E_ANDROID_AVD: clefsmith

  ios:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # The app build embeds the recorded corpus; see verify.yml.
          lfs: true

      # Installs what mise.toml pins, the same versions a developer runs.
      - uses: jdx/mise-action@v5

      # The runner's default Xcode is older than the SDK this Expo version
      # builds against. The newest installed one is selected rather than a
      # version written down here, which would rot with the runner image.
      - name: Select the newest installed Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - run: bun install --frozen-lockfile

      - run: bunx expo prebuild --platform ios --no-install

      # The pods are downloaded, and a hosted runner stalls on that download
      # often enough to have broken a run already. A real resolution error
      # fails the second attempt too.
      - run: pod install || pod install
        working-directory: ios

      # A simulator build signs nothing, so the job needs no certificate.
      - name: Build the app
        run: |
          xcodebuild -workspace ios/Clefsmith.xcworkspace \
            -scheme Clefsmith \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # The suite is pointed at a udid, never a device name: the same model
      # exists under every installed runtime.
      # The device model is read from the runtime that will host it: the global
      # device list also holds models no installed runtime supports, and simctl
      # answers "Incompatible device" rather than picking another.
      #
      # The boot is waited for: the driver gives a simulator two minutes to
      # finish booting, and a device created seconds earlier takes longer than
      # that on a hosted runner.
      - name: Create and boot a simulator
        run: |
          newest='.runtimes | map(select(.isAvailable and (.identifier | contains("iOS")))) | sort_by(.version | split(".") | map(tonumber)) | last'
          runtime=$(xcrun simctl list runtimes --json | jq -r "$newest | .identifier")
          device=$(xcrun simctl list runtimes --json | jq -r "$newest | .supportedDeviceTypes | map(select(.productFamily == \"iPhone\")) | last | .identifier")
          udid=$(xcrun simctl create clefsmith-e2e "$device" "$runtime")
          xcrun simctl bootstatus "$udid" -b
          echo "E2E_IOS_UDID=$udid" >> "$GITHUB_ENV"

      - run: bun run e2e
        env:
          E2E_PLATFORM: ios
          E2E_IOS_APP: ${{ github.workspace }}/ios/build/Build/Products/Release-iphonesimulator/Clefsmith.app
