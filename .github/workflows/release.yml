name: release

# A merge into main is a push to it. Nothing runs on an increment branch: a
# release is cut from what main holds, not from what is on its way there.
on:
  push:
    branches: [main]

# Two merges in a row must not race over the same release pull request.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A dedicated token, not GITHUB_TOKEN: pull requests opened with the
      # latter trigger no workflow — GitHub's guard against a workflow feeding
      # itself — and the release pull request would carry no checks, which is
      # exactly what it needs the day a check becomes required.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please rewrites app.json through JSON.stringify(..., 2), which
      # re-expands the arrays the formatter keeps on one line — and the format
      # check then refuses the very pull request meant to cut the release.
      # Reformatting it here rather than carving app.json out of the formatter:
      # the file is hand-edited too, and an exception would hold for every
      # edit to buy back the one release-please makes.
      - if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - if: ${{ steps.release.outputs.pr }}
        uses: jdx/mise-action@v5

      # The repository's own formatter, at the version the lockfile pins: a
      # version named here would disagree with it the day either moves.
      - if: ${{ steps.release.outputs.pr }}
        run: bun install --frozen-lockfile

      # No `env:` reading the action's output here: a step-level `env` is
      # evaluated even when the step is skipped, so a run that opened no release
      # pull request would fail on the template rather than skip. The checkout
      # above already left us on the branch, which is what `git push` needs.
      - if: ${{ steps.release.outputs.pr }}
        run: |
          bunx biome format --write app.json
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore: format app.json after release-please'
          git push
